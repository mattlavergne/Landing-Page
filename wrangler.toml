# Cloudflare Worker config for mattlavergne.com.
#
# Deploys src/index.js as the Worker "trafficmap-proxy" (same name as the
# existing dashboard Worker, so this takes it over in place) and uploads
# public/ as static assets. The routes below keep the Worker owning the whole
# domain, exactly as before.

name = "trafficmap-proxy"
main = "src/index.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker first for every request so /trafficmap is proxied; the Worker
# serves the landing page for everything else via env.ASSETS.
run_worker_first = true

# Cloud saves for The Apple (/apple/api, src/apple-api.js). One-time setup:
#   1. Cloudflare dashboard -> Storage & Databases -> D1 -> Create database,
#      name it "apple-saves" (or run: npx wrangler d1 create apple-saves).
#   2. Paste its Database ID below and uncomment the four lines.
# Until then the API answers "sync not configured" and everything else works.
# [[d1_databases]]
# binding = "APPLE_DB"
# database_name = "apple-saves"
# database_id = "PASTE-DATABASE-ID-HERE"

[[routes]]
pattern = "mattlavergne.com/*"
zone_name = "mattlavergne.com"

[[routes]]
pattern = "*.mattlavergne.com/*"
zone_name = "mattlavergne.com"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>The Apple · Control Center</title>
<link rel="stylesheet" href="/apple/portal/style.css">
<script type="module" src="/apple/portal/app.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Sections">
    <div class="brand"><span class="brand-apple" aria-hidden="true">🍎</span><span><b>The Apple</b><small>Control Center</small></span></div>
    <nav id="nav">
      <button data-view="today"><span aria-hidden="true">☀️</span>Today</button>
      <button data-view="calendar"><span aria-hidden="true">📅</span>Calendar</button>
      <button data-view="notices"><span aria-hidden="true">📣</span>Announcements</button>
      <button data-view="tours"><span aria-hidden="true">🎪</span>Orchard Tours</button>
      <button data-view="skins"><span aria-hidden="true">🎨</span>Skins</button>
      <button data-view="stats"><span aria-hidden="true">📊</span>Stats</button>
      <button data-view="history"><span aria-hidden="true">🕘</span>History</button>
      <button data-view="settings"><span aria-hidden="true">⚙️</span>Settings</button>
    </nav>
    <div class="side-foot">
      <a href="/apple/test/" target="_blank" rel="noopener">Open the test game ↗</a>
      <small id="who"></small>
    </div>
  </aside>
  <div class="main">
    <header class="bar">
      <button class="menu-btn" id="menu-btn" aria-label="Sections" aria-expanded="false">☰</button>
      <div class="bar-status" id="bar-status" role="status" aria-live="polite">Loading…</div>
      <div class="bar-actions">
        <button class="btn ghost" id="pv-toggle" aria-pressed="false" title="The test game beside the editor, playing your draft">📱 Preview</button>
        <span class="saved" id="saved"></span>
        <button class="btn ghost" id="discard" hidden>Discard</button>
        <button class="btn primary" id="review" hidden>Review &amp; publish</button>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="view" tabindex="-1"></main>
  </div>
  <aside class="preview" id="preview" aria-label="Live preview" hidden>
    <header><b>📱 Preview</b><span class="muted small" id="pv-day"></span><span class="grow"></span><button class="btn small ghost" id="pv-today">Today</button><button class="icon" id="pv-reload" aria-label="Start the preview again">↻</button><button class="icon" id="pv-close" aria-label="Close the preview">✕</button></header>
    <div class="pv-stage" id="pv-stage"><iframe id="pv-frame" title="The test game, playing your draft"></iframe></div>
    <p class="muted small pv-note">Your draft in the test game, on its own test save. Edits show at once; opening a day, week or tour shows that day. Players see nothing until you publish.</p>
  </aside>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog" aria-labelledby="drawer-title" hidden>
  <header><h2 id="drawer-title"></h2><button class="icon" id="drawer-close" aria-label="Close">✕</button></header>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="modal-card"><h2 id="modal-title"></h2><div id="modal-body"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
